[project]
name = "mustrd"
version = "0.7.4"
description = "A Spec By Example framework for RDF and SPARQL, Inspired by Cucumber."
authors = [
    { name = "John Placek", email = "john.placek@semanticpartners.com" },
    { name = "Juliane Piñeiro-Winkler", email = "juliane.pineiro-winkler@semanticpartners.com" },
    { name = "Aymeric Picou", email = "aymeric.picou@semanticpartners.com" },
    { name = "Lance Paine", email = "lance.paine@semanticpartners.com" },
    { name = "Andrew Large", email = "andy.large@semanticpartners.com" },
]
classifiers = [
    "Programming Language :: Python",
    "Framework :: Pytest",
    "Natural Language :: English",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]
readme = "README.md"
license = "MIT License"
urls = {"repository" = "https://github.com/Semantic-partners/mustrd"}
entry-points = {"pytest11" = {"mustrd_plugin" = "mustrd.mustrdTestPlugin"}}
scripts = {"mustrd" = "mustrd.cli:main"}

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
rdflib = "^7.1.3"
# Not a caret: `^7.2.0` means <8, which forbade the pytest that carries the fix for
# GHSA-6w46-j5rx-g56g (tmpdir handling, fixed in 9.0.3). Verified against both ends
# of this range — 7.4.4 and 9.0.3 — after pytest_collect_file moved to the
# `file_path` hook argument. Widened rather than raised to >=9.0.3 so that consumers
# pinning pytest 7 or 8 can still install mustrd; the trade-off is that this range
# still admits a vulnerable pytest, so Dependabot keeps one alert open against it.
pytest = ">=7.2.0,<10"
pandas = "^2.0"
numpy = [
    { version = ">=1.26,<3", python = "<3.13" },
    { version = ">=2.1,<3", python = ">=3.13" },
]
multimethods-py = "^0.5.3"
colorlog = "^6.7.0"
requests = "^2.28.2"
tabulate = "^0.9.0"
beautifulsoup4 = "^4.11.1"
openpyxl = "^3.1.2"
toml = "^0.10.2"
pyshacl="^0.30.0"
tomli = "^2.0.1"
flake8 = "7.0.0"
coverage = "7.4.3"
colorama = "0.4.6"
# urllib3 is deliberately NOT listed here. It arrives via requests, and mustrd
# reaches it as requests.packages.urllib3 — see the cipher note in mustrd.py, which
# is what the old `urllib3 = "1.26.19"` pin existed to keep working. That pin held
# the package five advisories behind (15 of 29 Dependabot alerts); the workaround is
# now guarded by hasattr instead, so urllib3 can float to a patched 2.x.
#
# Exact pins are a trap in a library generally: they force the version on every
# consumer, so each new CVE becomes an alert only we can clear.
Jinja2 = "^3.1.6"
edn-format = "^0.7.5"


[tool.poetry.dev-dependencies]

[tool.poetry.group.dev.dependencies]
autopep8 = "^2.0.2"
playwright = "^1.61.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
