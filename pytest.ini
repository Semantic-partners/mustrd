[pytest]
pythonpath = src test
# A deprecation raised by MUSTRD's own code is a build failure, not a line in a
# warnings summary. rdflib deprecated ConjunctiveGraph, mustrd kept calling it,
# and this suite printed that warning five times among 146 others for weeks — a
# wall nobody reads — until a user installed 0.8.0rc1, saw fourteen per run
# naming a mustrd line, and reported it. With this in place that release fails
# CI: 46 tests, not 5 buried lines.
#
# Scoped by CALLER, not by where the warning is written: rdflib raises its
# deprecations with stacklevel=2, so each is attributed to whoever called in.
# `mustrd.*` therefore means "mustrd reached for something deprecated" and says
# nothing about rdflib's own internal use of its own deprecated APIs, which is
# not ours to fix (see utils.rdflib_internals_quiet).
# FutureWarning too: pandas' "incompatible dtype" notice on a mustrd line is the
# same shape of problem — our code, still working, scheduled to stop.
filterwarnings =
    ignore::UserWarning:.*_pytestfixturefunction is not defined in namespace .*
    error::DeprecationWarning:mustrd.*
    error::FutureWarning:mustrd.*
addopts = -v --mustrd
