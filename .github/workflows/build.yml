name: Python package

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11.11"]

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install dependencies
        run: poetry install

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          poetry run flake8 . --exclude .venv --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          poetry run flake8 . --exclude .venv --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Run normal pytest tests
        run:  poetry run coverage run -m pytest test/ --doctest-modules --junitxml=junit/test-results-${{ matrix.python-version }}.xml
      - name: Run mustrd tests
        run:  poetry run pytest --mustrd --md=junit/github_job_summary.md --config=.github/test_config.ttl
      - name: Run ontology term-coverage example
        # Runs the runnable geography example with --term-coverage --cq so its
        # report shows up in the job summary below and the committed report is
        # regenerated. Collection is scoped to the example dir.
        run:  poetry run pytest docs/examples/geography-example --mustrd --config=docs/examples/geography-example/mustrd-config.ttl --term-coverage --cq --md=docs/examples/geography-example/report/term-coverage-example.md --term-coverage-rdf=docs/examples/geography-example/report/term-coverage-example.ttl
        if: ${{ always() }}
      - name: Upload pytest test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: junit/test-results-${{ matrix.python-version }}.xml
      - name: Upload ontology coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: |
            docs/examples/geography-example/report/term-coverage-example.ttl
            docs/examples/geography-example/report/term-coverage-example.md
          if-no-files-found: warn
      - name: Define Job summary
        run: |
          cat junit/github_job_summary.md >> $GITHUB_STEP_SUMMARY
          printf '\n\n---\n\n' >> $GITHUB_STEP_SUMMARY
          cat docs/examples/geography-example/report/term-coverage-example.md >> $GITHUB_STEP_SUMMARY
        if: ${{ always() }}
      - name: Generate coverage HTML report
        run: poetry run coverage html --directory=htmlcov --include=mustrd/*
        if: ${{ always() }}
      - name: Upload coverage HTML summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage-htmlcov
          path: htmlcov
          retention-days: 7
        if: ${{ always() }}