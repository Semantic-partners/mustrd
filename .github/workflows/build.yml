name: Python package

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11.11"]

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install dependencies
        run: poetry install

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          poetry run flake8 . --exclude .venv --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          poetry run flake8 . --exclude .venv --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Run normal pytest tests
        run:  poetry run coverage run -m pytest test/ --doctest-modules --junitxml=junit/test-results-${{ matrix.python-version }}.xml
      - name: Run mustrd tests
        run:  poetry run pytest --mustrd --md=junit/github_job_summary.md --config=.github/test_config.ttl
      - name: Run ontology term-coverage example
        # Runs the runnable geography example with --term-coverage --cq so its
        # report shows up in the job summary below and the committed report is
        # regenerated. Collection is scoped to the example dir.
        run:  poetry run pytest docs/examples/geography-example --mustrd --config=docs/examples/geography-example/mustrd-config.ttl --term-coverage --cq --md=docs/examples/geography-example/report/term-coverage-example.md --term-coverage-rdf=docs/examples/geography-example/report/term-coverage-example.ttl
        if: ${{ always() }}
      - name: Build the example run viewer
        # The self-contained HTML report published at /examples/geography-example/report/.
        # Run from the example directory so the paths in the graph — and therefore
        # the page's source links — are relative to the example, not the repo root.
        working-directory: docs/examples/geography-example
        run: >-
          poetry run pytest . --mustrd --config=mustrd-config.ttl --term-coverage --cq
          --viewer=report/index.html
          --viewer-title="Geography example — mustrd run report"
          --viewer-src-base="../"
        if: ${{ always() }}
      - name: Check the example viewer renders
        # The page's own JavaScript, run against a stub DOM: catches a broken
        # template include or a view that throws before the page is published.
        run: node test/viewer_smoke.mjs docs/examples/geography-example/report/index.html
        if: ${{ always() }}
      - name: Upload pytest test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: junit/test-results-${{ matrix.python-version }}.xml
      - name: Upload ontology coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: |
            docs/examples/geography-example/report/term-coverage-example.ttl
            docs/examples/geography-example/report/term-coverage-example.md
            docs/examples/geography-example/report/index.html
          if-no-files-found: warn
      - name: Define Job summary
        # Guard each cat so a failure in an earlier step (which may skip the step
        # that writes a summary file) surfaces as that step's error, not a
        # confusing "No such file" here.
        run: |
          if [ -f junit/github_job_summary.md ]; then cat junit/github_job_summary.md >> $GITHUB_STEP_SUMMARY; fi
          printf '\n\n---\n\n' >> $GITHUB_STEP_SUMMARY
          if [ -f docs/examples/geography-example/report/term-coverage-example.md ]; then cat docs/examples/geography-example/report/term-coverage-example.md >> $GITHUB_STEP_SUMMARY; fi
        if: ${{ always() }}
      - name: Generate coverage HTML report
        run: poetry run coverage html --directory=htmlcov --include=mustrd/*
        if: ${{ always() }}
      - name: Upload coverage HTML summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage-htmlcov
          path: htmlcov
          retention-days: 7
        if: ${{ always() }}