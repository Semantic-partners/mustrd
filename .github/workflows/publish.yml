# .github/workflows/publish.yml
#
# Publish mustrd to PyPI. The pushed git tag is the single source of truth for
# what ships and under what version — the committed pyproject.toml version is
# overwritten at build time. Version numbers are plain ordinals, not semver
# promises (see RELEASING.md).
#
# Cut a release:
#   git tag 0.7.5 <sha>        # tag string == PyPI version, no "v" prefix
#   git push origin 0.7.5      # -> builds that SHA, publishes 0.7.5, cuts a GH Release
#
# Cut a candidate / beta (PEP 440 a/b/rc suffix — pip hides these from
# `pip install mustrd` unless the user passes --pre or pins the exact version):
#   git tag 0.8.0rc1 <sha>
#   git push origin 0.8.0rc1
#
# Manual run (Actions -> Publish to PyPI -> Run workflow) re-publishes a one-off
# version without tagging (no GitHub Release is cut in that case).
#
# Rehearsing without touching real PyPI: pushing a candidate tag (e.g. 0.7.5rc1)
# is already a safe rehearsal — pip hides pre-releases from normal installs. If
# you ever want a fully isolated sandbox instead, TestPyPI (https://test.pypi.org)
# is a separate throwaway instance with its own account/token; add a
# TESTPYPI_API_TOKEN secret and a publish step pointing at
# https://test.pypi.org/legacy/. Deliberately not wired up here to keep this simple.
name: Publish to PyPI

on:
  push:
    tags:
      # Any tag that starts with a digit is a version tag (0.7.5, 0.8.0rc1,
      # 2026.7.24, ...). Branch-style tags starting with a letter are ignored.
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "PEP 440 version to publish, e.g. 0.7.5 (final) or 0.8.0rc1 (beta)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Needed to create the GitHub Release from the tag.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Resolve version + channel
        id: v
        # Untrusted text (a tag name, a dispatch input) reaches the script only through
        # environment variables and Python's argv, never spliced into shell or Python source:
        # a tag name may contain quotes, and ${{ }} is substituted before the shell parses.
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          python -m pip install --quiet packaging
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            V="$GITHUB_REF_NAME"          # the pushed tag, verbatim
          else
            V="$DISPATCH_VERSION"
          fi
          V="${V#v}"                      # tolerate an accidental leading "v"
          # Fail fast on a typo'd tag, and normalise (e.g. 0.8.0-rc1 -> 0.8.0rc1). Version()
          # accepts only PEP 440, so what comes out is safe to use anywhere.
          RESOLVED="$(python -c 'import sys; from packaging.version import Version; v = Version(sys.argv[1]); print(v, str(v.is_prerelease).lower())' "$V")"
          read -r NORM IS_PRE <<< "$RESOLVED"
          echo "version=$NORM"       >> "$GITHUB_OUTPUT"
          echo "prerelease=$IS_PRE"  >> "$GITHUB_OUTPUT"
          echo "Publishing mustrd $NORM (prerelease=$IS_PRE)"

      - name: Stamp the version onto the package
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: poetry version "$VERSION"

      - name: Build (clean dist first)
        run: |
          rm -rf dist
          poetry build

      - name: Publish to PyPI
        env:
          # Poetry reads this env var as the PyPI upload token automatically.
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
        run: poetry publish

      - name: Create GitHub Release
        # Only on a tag push — a manual dispatch has no tag to attach notes to.
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release created in the GitHub UI creates its tag, and that tag push is what
          # started this run; the push event looks the same either way, so check for the
          # release itself. If it exists, it is the one the release manager wrote: keep it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists (created in the GitHub UI); keeping it."
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            ${{ steps.v.outputs.prerelease == 'true' && '--prerelease' || '' }}
