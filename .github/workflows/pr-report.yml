# Comment on a pull request with a link to the run report CI built for it.
#
# Runs on workflow_run rather than pull_request, for the same reason coverage.yml
# does: a pull_request job from a fork has a read-only token and no secrets, so it
# cannot comment. This workflow runs against the base repo after CI finishes, and
# never checks out the PR's code.
name: Report comment

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  comment:
    name: Link the run report on the PR
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    permissions:
      pull-requests: write      # to post/update the comment
      actions: read             # to find the artifact from the CI run
    steps:
      # DO NOT check out the PR's code here — see the note above.

      # The Markdown reports, to render inline in the comment. GitHub sanitises
      # comment HTML (no script, no style, images over https only), so the
      # self-contained page itself can only be offered as a download; the Markdown
      # carries the same numbers and renders natively.
      - name: Download the report artifact
        id: download
        continue-on-error: true          # a failed CI run may not have produced one
        uses: actions/download-artifact@v4
        with:
          name: mustrd-report
          path: report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Find the report artifact and comment
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = context.payload.workflow_run.id;
            const { owner, repo } = context.repo;

            const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id, per_page: 100,
            });
            const report = artifacts.find(a => a.name === 'mustrd-report');
            if (!report) {
              core.info('No mustrd-report artifact on this run; nothing to comment.');
              return;
            }

            // workflow_run does not carry the PR for fork runs, so fall back to
            // matching on the head SHA.
            const head = context.payload.workflow_run.head_sha;
            let number = (context.payload.workflow_run.pull_requests || [])[0]?.number;
            if (!number) {
              const { data: prs } =
                await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner, repo, commit_sha: head,
                });
              number = prs.find(pr => pr.state === 'open')?.number;
            }
            if (!number) {
              core.info(`No open PR found for ${head}; nothing to comment.`);
              return;
            }

            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${run_id}`;
            const artifactUrl = `${runUrl}/artifacts/${report.id}`;
            const size = (report.size_in_bytes / 1024).toFixed(0);
            const conclusion = context.payload.workflow_run.conclusion;

            // The Markdown reports render in the comment; the pages are the
            // interactive version. Collapsed, so the comment stays scannable.
            const fs = require('fs');
            const COMMENT_LIMIT = 65536;
            const sections = [];
            for (const [file, title] of [
              ['report/geography-example.md', 'Ontology coverage &amp; competency questions (worked example)'],
              ['report/mustrd-suite.md', "mustrd's own specs"],
            ]) {
              let md;
              try { md = fs.readFileSync(file, 'utf8').trim(); } catch { continue; }
              if (md) sections.push({ title, md });
            }

            const marker = '<!-- mustrd-report -->';
            const header = [
              marker,
              '### mustrd run report',
              '',
              `\`${head.slice(0, 7)}\` · CI ${conclusion} · [built by this run](${runUrl})`,
              '',
              `[**Download the interactive report**](${artifactUrl}) — ${size} KB. Two`,
              'self-contained pages: unzip and open either in a browser, no build step and',
              'nothing to install. The pass/fail tree, the coverage table, and every spec',
              'with the SPARQL it ran and the datasets it loaded. GitHub cannot render them',
              'inline — it strips script and style — so the same reports are below as',
              'Markdown.',
            ];
            const footer = [
              '',
              "<sub>Drop another run's <code>.ttl</code> onto a page to compare two runs.</sub>",
            ];

            // Inline what fits; a report too large to inline still has its download.
            let body = header.join('\n');
            for (const { title, md } of sections) {
              const block = `\n\n<details>\n<summary><b>${title}</b></summary>\n\n${md}\n\n</details>`;
              if (body.length + block.length + footer.join('\n').length > COMMENT_LIMIT - 512) {
                body += `\n\n<sub>${title} omitted: too large to inline. It is in the download.</sub>`;
                continue;
              }
              body += block;
            }
            body += footer.join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: number, per_page: 100,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
              core.info(`Updated comment on #${number}.`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: number, body,
              });
              core.info(`Commented on #${number}.`);
            }
