# Comment on a pull request with a link to the run report CI built for it.
#
# Runs on workflow_run rather than pull_request, for the same reason coverage.yml
# does: a pull_request job from a fork has a read-only token and no secrets, so it
# cannot comment. This workflow runs against the base repo after CI finishes, and
# never checks out the PR's code.
name: Report comment

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  comment:
    name: Link the run report on the PR
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    permissions:
      pull-requests: write      # to post/update the comment
      actions: read             # to find the artifact from the CI run
    steps:
      # DO NOT check out the PR's code here — see the note above.
      - name: Find the report artifact and comment
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = context.payload.workflow_run.id;
            const { owner, repo } = context.repo;

            const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id, per_page: 100,
            });
            const report = artifacts.find(a => a.name === 'mustrd-report');
            if (!report) {
              core.info('No mustrd-report artifact on this run; nothing to comment.');
              return;
            }

            // workflow_run does not carry the PR for fork runs, so fall back to
            // matching on the head SHA.
            const head = context.payload.workflow_run.head_sha;
            let number = (context.payload.workflow_run.pull_requests || [])[0]?.number;
            if (!number) {
              const { data: prs } =
                await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner, repo, commit_sha: head,
                });
              number = prs.find(pr => pr.state === 'open')?.number;
            }
            if (!number) {
              core.info(`No open PR found for ${head}; nothing to comment.`);
              return;
            }

            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${run_id}`;
            const artifactUrl = `${runUrl}/artifacts/${report.id}`;
            const size = (report.size_in_bytes / 1024).toFixed(0);
            const conclusion = context.payload.workflow_run.conclusion;

            const marker = '<!-- mustrd-report -->';
            const body = [
              marker,
              `### mustrd run report`,
              '',
              `[**Download the report**](${artifactUrl}) — ${size} KB, \`${head.slice(0, 7)}\`, CI ${conclusion}.`,
              '',
              'Two self-contained pages, no build step and nothing to install: unzip and',
              'open either in a browser.',
              '',
              '| | |',
              '|---|---|',
              '| `mustrd-suite.html` | mustrd\'s own specs — the pass/fail tree, every spec and the files it reads |',
              '| `geography-example.html` | the worked example — ontology term coverage and competency questions |',
              '',
              `<sub>Built by [this run](${runUrl}). Drop another run\'s \`.ttl\` onto a page to compare.</sub>`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: number, per_page: 100,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
              core.info(`Updated comment on #${number}.`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: number, body,
              });
              core.info(`Commented on #${number}.`);
            }
