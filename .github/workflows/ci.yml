# .github/workflows/ci.yml
name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every cell; a Windows/3.13 failure must not cancel the rest.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        # git-bash on the Windows runners so echo -e / heredocs behave identically.
        shell: bash
    permissions:
      # Gives the action the necessary permissions for publishing new
      # comments in pull requests.
      pull-requests: write
      # Gives the action the necessary permissions for pushing data to the
      # python-coverage-comment-action branch, and for editing existing
      # comments (to avoid publishing multiple comments in the same PR)
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install dependencies
        run: poetry install
      - name: Create coverage config file
        run: echo -e "[run]\nrelative_files = True" >> .coveragerc
      - name: Test with pytest
        run: poetry run coverage run -m pytest test/ --doctest-modules --config=pytest.ini
      - name: Test mustrd.ttl with the mustrd plugin
        run: |
          # install our working copy of mustrd as a local package, and run the tests as a mustrdPlugin
          poetry run pip install -e .
          poetry run pytest --mustrd --config="test/test_config_local.ttl"
      # Coverage comment runs once, from a single canonical cell, so the
      # matrix does not post six duplicate comments / race the coverage branch.
      - name: Coverage comment
        id: coverage_comment
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Store Pull Request comment to be posted
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
