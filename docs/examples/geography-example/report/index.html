<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geography example — mustrd run report</title>
<!--
  mustrd run viewer — a single self-contained page, driven entirely by RDF.

  There is no build step and no network dependency: the run's Turtle is embedded
  below (or dropped in / fetched with ?ttl=), parsed by the Turtle parser in this
  file, and the whole UI is built from the resulting triples using the
  cov:/must:/cq:/dqv: vocabularies. See mustrd/model/coverage-ontology.ttl.

  The UI is VanJS (1.6.1, MIT, ~5KB, vendored inline below) — reactive DOM
  construction, so the page holds no HTML strings and nothing needs escaping.
-->
<style>
  :root {
    --bg: #0f1117; --surface: #171a23; --surface-2: #1e222d; --raise: #252a37;
    --border: #2a2f3d; --hair: #21252f;
    --text: #e4e6ec; --muted: #8b90a0; --heading: #f4f5f8;
    --accent: #6ee7b7; --accent-2: #93c5fd;
    --pass: #34d399; --pass-soft: #10291f; --pass-line: #1f5a41;
    --fail: #f87171; --fail-soft: #2c1416; --fail-line: #6b2529;
    --skip: #a78bfa; --skip-soft: #1e1a2e; --skip-line: #40356b;
    --warn: #fbbf24; --warn-soft: #2a2010; --warn-line: #5e4715;
    --info: #60a5fa; --info-soft: #111c2e; --info-line: #24446f;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -18px rgba(0,0,0,.8);
    --radius: 12px;
    --font-display: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --font-body: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  /* Three theme states: follow the OS by default, or an explicit data-theme (set
     by the ◐ button) which wins in either direction. Dark is the base palette,
     so the two light rules below carry the light one. */
  :root[data-theme="light"] {
    --bg: #eef1f5; --surface: #ffffff; --surface-2: #f5f7fa; --raise: #eceff4;
    --border: #d4dae2; --hair: #e5e9ef;
    --text: #29323c; --muted: #616c7a; --heading: #111a24;
    --accent: #0d8f6f; --accent-2: #2563eb;
    --pass: #0f8a5f; --pass-soft: #e3f5ec; --pass-line: #a5d9c2;
    --fail: #c62f38; --fail-soft: #fdeaea; --fail-line: #edb4b6;
    --skip: #6d4ec9; --skip-soft: #efeafc; --skip-line: #c6b8ee;
    --warn: #96650b; --warn-soft: #fdf1dc; --warn-line: #e6c98c;
    --info: #1d63c9; --info-soft: #e7effc; --info-line: #b3ccf0;
    --shadow: 0 1px 2px rgba(17,26,36,.05), 0 10px 28px -16px rgba(17,26,36,.25);
    color-scheme: light;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
      --bg: #eef1f5; --surface: #ffffff; --surface-2: #f5f7fa; --raise: #eceff4;
      --border: #d4dae2; --hair: #e5e9ef;
      --text: #29323c; --muted: #616c7a; --heading: #111a24;
      --accent: #0d8f6f; --accent-2: #2563eb;
      --pass: #0f8a5f; --pass-soft: #e3f5ec; --pass-line: #a5d9c2;
      --fail: #c62f38; --fail-soft: #fdeaea; --fail-line: #edb4b6;
      --skip: #6d4ec9; --skip-soft: #efeafc; --skip-line: #c6b8ee;
      --warn: #96650b; --warn-soft: #fdf1dc; --warn-line: #e6c98c;
      --info: #1d63c9; --info-soft: #e7effc; --info-line: #b3ccf0;
      --shadow: 0 1px 2px rgba(17,26,36,.05), 0 10px 28px -16px rgba(17,26,36,.25);
      color-scheme: light;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font-body);
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent-2); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, .mono { font-family: var(--font-mono); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 1.6rem clamp(.85rem, 3vw, 2rem) 5rem; }

  /* ---------- header ---------- */
  header.top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1rem 1.4rem; }
  .brand { display: flex; align-items: baseline; gap: .55rem; }
  .brand h1 {
    font-family: var(--font-display); font-weight: 600; color: var(--heading);
    font-size: clamp(1.5rem, 3.4vw, 2.1rem); margin: 0; letter-spacing: -.015em;
  }
  .brand .dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--accent); }
  .eyebrow {
    font-family: var(--font-mono); font-size: .68rem; letter-spacing: .16em;
    text-transform: uppercase; color: var(--muted); margin: 0 0 .35rem;
  }
  .runmeta { display: flex; flex-wrap: wrap; gap: .35rem .9rem; font-size: .78rem; color: var(--muted); }
  .runmeta .k { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .08em; font-size: .66rem; opacity: .8; }
  .actions { margin-left: auto; display: flex; gap: .5rem; align-items: center; }

  button, .btn {
    font: inherit; font-size: .8rem; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: .38rem .7rem;
    cursor: pointer; display: inline-flex; align-items: center; gap: .4rem;
  }
  button:hover, .btn:hover { background: var(--raise); }

  /* ---------- summary tiles ---------- */
  .tiles { display: grid; gap: .8rem; margin: 1.6rem 0 0;
           grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .tile {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: .85rem 1rem; box-shadow: var(--shadow);
  }
  .tile .label {
    font-family: var(--font-mono); font-size: .66rem; letter-spacing: .12em;
    text-transform: uppercase; color: var(--muted);
  }
  .tile .big { font-size: 1.75rem; font-weight: 600; color: var(--heading); line-height: 1.15; margin: .25rem 0 .1rem; }
  .tile .big small { font-size: .8rem; font-weight: 400; color: var(--muted); }
  .tile .sub { font-size: .76rem; color: var(--muted); }
  .bar { display: flex; height: 6px; border-radius: 99px; overflow: hidden; background: var(--raise); margin-top: .55rem; }
  .bar span { display: block; }
  .bar .p { background: var(--pass); } .bar .f { background: var(--fail); } .bar .s { background: var(--skip); }
  .bar .c { background: var(--accent); } .bar .q { background: var(--info); }

  /* ---------- tabs ---------- */
  nav.tabs { margin: 1.8rem 0 0; border-bottom: 1px solid var(--border); }
  nav.tabs .tabrow { display: flex; flex-wrap: wrap; gap: .3rem; }
  nav.tabs button {
    background: none; border: none; border-bottom: 2px solid transparent;
    border-radius: 0; padding: .55rem .8rem; color: var(--muted); font-size: .86rem;
  }
  nav.tabs button:hover { background: var(--hair); color: var(--text); }
  nav.tabs button[aria-selected="true"] { color: var(--heading); border-bottom-color: var(--accent); font-weight: 600; }
  nav.tabs .n { font-family: var(--font-mono); font-size: .72rem; opacity: .75; }

  main { margin-top: 1.4rem; }

  /* ---------- toolbar ---------- */
  .toolbar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: 1rem; }
  .search {
    flex: 1 1 240px; min-width: 180px; font: inherit; font-size: .85rem; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: .45rem .7rem;
  }
  .search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .chips { display: flex; flex-wrap: wrap; gap: .35rem; }
  .chip {
    font-size: .78rem; padding: .3rem .65rem; border-radius: 99px;
    border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer;
  }
  .chip[aria-pressed="true"] { color: var(--heading); border-color: var(--cl, var(--accent)); background: var(--cs, var(--raise)); font-weight: 600; }
  .chip.pass { --cl: var(--pass-line); --cs: var(--pass-soft); }
  .chip.fail { --cl: var(--fail-line); --cs: var(--fail-soft); }
  .chip.skip { --cl: var(--skip-line); --cs: var(--skip-soft); }
  .chip .n { font-family: var(--font-mono); opacity: .8; }

  /* ---------- cards / sections ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
  }
  .card + .card { margin-top: 1rem; }
  .sec-head { display: flex; align-items: baseline; gap: .8rem; margin: 2rem 0 .9rem; }
  .sec-head h2 { font-family: var(--font-display); font-size: 1.22rem; color: var(--heading); margin: 0; font-weight: 600; }
  .sec-head .rule { flex: 1; height: 1px; background: var(--hair); }
  .sec-head .n { font-family: var(--font-mono); font-size: .74rem; color: var(--muted); }
  .note { font-size: .83rem; color: var(--muted); max-width: 78ch; }
  .empty { padding: 2.5rem 1rem; text-align: center; color: var(--muted); font-size: .9rem; }

  /* ---------- test tree ---------- */
  .grp { border-top: 1px solid var(--hair); }
  .card > .grp:first-child { border-top: none; }
  .grp > summary {
    display: flex; align-items: center; gap: .6rem; padding: .6rem .9rem;
    cursor: pointer; background: var(--surface-2); list-style: none;
  }
  .grp > summary::-webkit-details-marker { display: none; }
  .grp > summary::before {
    content: "▸"; color: var(--muted); font-size: .7rem; width: .7rem; flex: none;
    transition: transform .12s ease;
  }
  .grp[open] > summary::before { transform: rotate(90deg); }
  .grp > summary:hover { background: var(--raise); }
  .grp .gname { font-family: var(--font-mono); font-size: .84rem; color: var(--heading); }
  .grp .gmeta { margin-left: auto; display: flex; gap: .5rem; align-items: center; font-size: .74rem; color: var(--muted); }

  .tests { list-style: none; margin: 0; padding: 0; }
  .tests > li { border-top: 1px solid var(--hair); }
  .t { display: flex; align-items: center; gap: .6rem; padding: .45rem .9rem .45rem 1.9rem; cursor: pointer; list-style: none; }
  .t::-webkit-details-marker { display: none; }
  .t:hover { background: var(--surface-2); }
  .t .name { font-family: var(--font-mono); font-size: .82rem; overflow-wrap: anywhere; }
  .t .right { margin-left: auto; display: flex; gap: .7rem; align-items: center; font-size: .74rem; color: var(--muted); }
  .dur { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  .pill {
    font-size: .68rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    padding: .1rem .45rem; border-radius: 5px; border: 1px solid var(--pl, var(--border));
    background: var(--ps, var(--raise)); color: var(--pc, var(--muted)); white-space: nowrap;
  }
  .pill.passed { --pc: var(--pass); --ps: var(--pass-soft); --pl: var(--pass-line); }
  .pill.failed { --pc: var(--fail); --ps: var(--fail-soft); --pl: var(--fail-line); }
  .pill.skipped { --pc: var(--skip); --ps: var(--skip-soft); --pl: var(--skip-line); }
  .pill.covered { --pc: var(--pass); --ps: var(--pass-soft); --pl: var(--pass-line); }
  .pill.query-only { --pc: var(--warn); --ps: var(--warn-soft); --pl: var(--warn-line); }
  .pill.schema { --pc: var(--info); --ps: var(--info-soft); --pl: var(--info-line); }
  .pill.unused { --pc: var(--fail); --ps: var(--fail-soft); --pl: var(--fail-line); }
  .pill.plain { --pc: var(--muted); }

  .detail { padding: .3rem .9rem 1rem 1.9rem; background: var(--surface-2); font-size: .82rem; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: .25rem .8rem; }
  .kv dt { font-family: var(--font-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .terms { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .15rem; }
  .term-chip {
    font-family: var(--font-mono); font-size: .74rem; padding: .08rem .4rem;
    border: 1px solid var(--border); border-radius: 5px; background: var(--surface); color: var(--text);
  }

  /* ---------- coverage table ---------- */
  .tblwrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .84rem; }
  th, td { text-align: left; padding: .4rem .7rem; border-top: 1px solid var(--hair); }
  thead th {
    border-top: none; border-bottom: 1px solid var(--border); background: var(--surface-2);
    font-family: var(--font-mono); font-size: .68rem; text-transform: uppercase;
    letter-spacing: .09em; color: var(--muted); font-weight: 600; white-space: nowrap;
    position: sticky; top: 0; z-index: 1;
  }
  th.c, td.c { text-align: center; }
  tbody tr.term { cursor: pointer; }
  tbody tr.term:hover { background: var(--surface-2); }
  tbody tr.ex > td { background: var(--surface-2); font-size: .8rem; padding-top: .2rem; padding-bottom: .2rem; }
  .tname { font-family: var(--font-mono); white-space: nowrap; }
  .glyph { color: var(--muted); opacity: .8; }
  .yes { color: var(--pass); } .no { color: var(--muted); opacity: .45; }
  abbr { text-decoration: none; border-bottom: 1px dotted var(--muted); cursor: help; }

  /* ---------- cq / issue cards ---------- */
  .cq { padding: .85rem 1rem; border-top: 1px solid var(--hair); }
  .card > .cq:first-child { border-top: none; }
  .cq .q { font-size: .98rem; color: var(--heading); font-weight: 600; margin: 0 0 .4rem; }
  .cq .badges { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .5rem; }
  .cq ul { margin: .25rem 0 0; padding-left: 1.1rem; }
  .cq li { margin: .15rem 0; }
  .warnrow { color: var(--warn); }

  /* ---------- embedded source ---------- */
  a.srclink { border-bottom: 1px dotted currentColor; }
  .src { margin-top: .5rem; }
  .src > summary {
    cursor: pointer; list-style: none; display: flex; align-items: center; gap: .5rem;
    font-family: var(--font-mono); font-size: .76rem; color: var(--muted);
    padding: .25rem 0;
  }
  .src > summary::-webkit-details-marker { display: none; }
  .src > summary::before { content: "▸"; font-size: .7rem; transition: transform .12s ease; }
  .src[open] > summary::before { transform: rotate(90deg); }
  .src > summary:hover { color: var(--text); }
  pre.code {
    margin: .3rem 0 0; padding: .7rem .85rem; overflow: auto; max-height: 24rem;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    font-family: var(--font-mono); font-size: .76rem; line-height: 1.5;
    white-space: pre; tab-size: 2;
  }
  .tok-comment { color: var(--muted); font-style: italic; }
  .tok-string  { color: var(--pass); }
  .tok-iri     { color: var(--accent-2); }
  .tok-pname   { color: var(--accent); }
  .tok-kw      { color: var(--warn); font-weight: 600; }
  .tok-var     { color: var(--skip); }
  .tok-num     { color: var(--info); }

  /* source overlay, opened from any file reference */
  .sheet {
    position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column;
    background: rgba(0,0,0,.6); padding: clamp(.5rem, 4vh, 3rem) clamp(.5rem, 4vw, 3rem);
  }
  .sheet .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); display: flex; flex-direction: column;
    max-height: 100%; width: 100%; max-width: 980px; margin: 0 auto; overflow: hidden;
  }
  .sheet .head {
    display: flex; align-items: center; gap: .8rem; padding: .6rem .9rem;
    border-bottom: 1px solid var(--border); background: var(--surface-2);
  }
  .sheet .head .path { font-family: var(--font-mono); font-size: .8rem; overflow-wrap: anywhere; }
  .sheet .head button { margin-left: auto; }
  .sheet pre.code { margin: 0; border: none; border-radius: 0; max-height: none; flex: 1; }

  /* ---------- dropzone ---------- */
  .drop {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center;
    z-index: 20; font-size: 1.1rem; color: #fff; pointer-events: none;
  }
  .drop .inner { border: 2px dashed var(--accent); border-radius: 16px; padding: 3rem 4rem; background: var(--surface); color: var(--text); }
  [hidden] { display: none !important; }
  .err { border-color: var(--fail-line); background: var(--fail-soft); color: var(--fail); padding: 1rem; border-radius: var(--radius); border: 1px solid var(--fail-line); }
  footer { margin-top: 3rem; font-size: .76rem; color: var(--muted); border-top: 1px solid var(--hair); padding-top: 1rem; }
</style>
</head>
<body>
<!-- The page builds itself: the two JSON blocks below are the only markup, and
     VanJS constructs the DOM from the RDF in them. Everything is inlined at
     render time from mustrd/templates/viewer/ — see mustrd/viewer.py. -->

function isLit(k) { return k.charCodeAt(0) === 76 && k.charCodeAt(1) === 1; }
function iriOf(k) { return k.slice(1, -1); }
function litOf(k) {
  var a = k.indexOf(SEP, 2), b = k.indexOf(SEP, a + 1);
  return { lang: k.slice(2, a), dt: k.slice(a + 1, b), v: k.slice(b + 1) };
}
function mkLit(v, dt, lang) { return "L" + SEP + (lang || "") + SEP + (dt || "") + SEP + v; }
/** Display string for any term: a literal's lexical form, else the IRI / bnode id. */
function text(k) {
  if (k === null || k === undefined) return null;
  return isLit(k) ? litOf(k).v : isIri(k) ? iriOf(k) : k;
}
function truthy(k) { return k !== null && k !== undefined && litOf(k).v === "true"; }
function num(k) { if (k === null || k === undefined) return null; var f = parseFloat(litOf(k).v); return isNaN(f) ? null : f; }

var PN_LOCAL_STOP = "\t\r\n \"'`;,()[]{}^";
var NUM_RE = /[+-]?(?:\d+\.\d*|\.\d+|\d+)(?:[eE][+-]?\d+)?/y;
var BNODE_RE = /[^\t\r\n "'`;,()[\]{}^.]+/y;

function parseTurtle(src) {
  var i = 0, n = src.length, base = "", bn = 0;
  var prefixes = Object.create(null), triples = [];

  function fail(msg) {
    var near = src.slice(Math.max(0, i - 40), i + 40).replace(/\s+/g, " ");
    throw new Error("Turtle: " + msg + " at offset " + i + " near …" + near + "…");
  }
  function ws() {
    for (;;) {
      while (i < n && (src[i] === " " || src[i] === "\t" || src[i] === "\n" || src[i] === "\r")) i++;
      if (src[i] === "#") { while (i < n && src[i] !== "\n") i++; } else return;
    }
  }
  function eat(s) { if (src.startsWith(s, i)) { i += s.length; return true; } return false; }
  function eatCI(s) {
    if (src.substr(i, s.length).toLowerCase() === s.toLowerCase()) { i += s.length; return true; }
    return false;
  }
  function escape() {
    i++;                                     // the backslash
    var c = src[i++];
    if (c === "t") return "\t";
    if (c === "b") return "\b";
    if (c === "n") return "\n";
    if (c === "r") return "\r";
    if (c === "f") return "\f";
    if (c === "u") { var h = src.substr(i, 4); i += 4; return String.fromCharCode(parseInt(h, 16)); }
    if (c === "U") { var H = src.substr(i, 8); i += 8; return String.fromCodePoint(parseInt(H, 16)); }
    return c;                                // \" \' \\ and reserved-char escapes
  }
  function resolve(iri) {
    if (/^[A-Za-z][A-Za-z0-9+.-]*:/.test(iri) || !base) return iri;
    try { return new URL(iri, base).href; } catch (e) { return iri; }
  }
  function iriRef() {
    i++;                                     // '<'
    var s = "";
    while (i < n && src[i] !== ">") s += src[i] === "\\" ? escape() : src[i++];
    if (src[i] !== ">") fail("unterminated IRI");
    i++;
    return resolve(s);
  }
  function pname() {
    var start = i;
    while (i < n && src[i] !== ":" && PN_LOCAL_STOP.indexOf(src[i]) < 0 && src[i] !== ".") i++;
    if (src[i] !== ":") { i = start; return null; }
    var pfx = src.slice(start, i);
    i++;
    var local = "";
    while (i < n) {
      var c = src[i];
      if (c === "\\") { local += escape(); continue; }
      if (c === "%") { local += src.substr(i, 3); i += 3; continue; }
      if (PN_LOCAL_STOP.indexOf(c) >= 0) break;
      if (c === ".") {                        // '.' is legal inside a local name, not at its end
        var nx = src[i + 1];
        if (nx === undefined || PN_LOCAL_STOP.indexOf(nx) >= 0 || nx === ".") break;
      }
      local += c; i++;
    }
    var ns = prefixes[pfx];
    if (ns === undefined) fail('undefined prefix "' + pfx + ':"');
    return ns + local;
  }
  function stringLit() {
    var q = eat('"""') ? '"""' : eat("'''") ? "'''"
          : src[i] === '"' ? (i++, '"') : src[i] === "'" ? (i++, "'") : null;
    if (q === null) return null;
    var s = "";
    for (;;) {
      if (i >= n) fail("unterminated string");
      if (src.startsWith(q, i)) { i += q.length; return s; }
      s += src[i] === "\\" ? escape() : src[i++];
    }
  }
  function numberLit() {
    NUM_RE.lastIndex = i;                    // sticky: no slicing, so parsing stays linear
    var m = NUM_RE.exec(src);
    if (!m) return null;
    var lex = m[0];
    i += lex.length;
    var dt = /[eE]/.test(lex) ? XSD + "double" : lex.indexOf(".") >= 0 ? XSD + "decimal" : XSD + "integer";
    return mkLit(lex, dt, null);
  }
  /** Any subject/object. Emits nested triples for [] property lists and () lists. */
  function term() {
    ws();
    var c = src[i];
    if (c === "<") return K(iriRef());
    if (c === "_" && src[i + 1] === ":") {
      i += 2;
      BNODE_RE.lastIndex = i;                // '.' is not accepted, so "_:b0 ." terminates cleanly
      var m = BNODE_RE.exec(src);
      if (!m) fail("empty blank node label");
      i += m[0].length;
      return "_:" + m[0];
    }
    if (c === "[") {
      i++;
      var b = "_:b" + (bn++);
      ws();
      if (src[i] === "]") { i++; return b; }
      predObjList(b);
      ws();
      if (src[i] !== "]") fail("expected ]");
      i++;
      return b;
    }
    if (c === "(") {
      i++;
      var items = [];
      for (;;) { ws(); if (src[i] === ")") { i++; break; } if (i >= n) fail("unterminated collection"); items.push(term()); }
      if (!items.length) return K(RDF + "nil");
      var head = "_:b" + (bn++), cur = head;
      for (var x = 0; x < items.length; x++) {
        triples.push([cur, K(RDF + "first"), items[x]]);
        var rest = x === items.length - 1 ? K(RDF + "nil") : "_:b" + (bn++);
        triples.push([cur, K(RDF + "rest"), rest]);
        cur = rest;
      }
      return head;
    }
    if (c === '"' || c === "'") {
      var v = stringLit();
      if (eat("^^")) { ws(); var dt = src[i] === "<" ? iriRef() : pname(); return mkLit(v, dt, null); }
      if (src[i] === "@") { i++; var lg = ""; while (i < n && /[A-Za-z0-9-]/.test(src[i])) lg += src[i++]; return mkLit(v, null, lg); }
      return mkLit(v, null, null);
    }
    if (c === "+" || c === "-" || c === "." || (c >= "0" && c <= "9")) {
      var nl = numberLit();
      if (nl) return nl;
    }
    if (src.startsWith("true", i) && PN_LOCAL_STOP.indexOf(src[i + 4] || " ") >= 0) { i += 4; return mkLit("true", XSD + "boolean", null); }
    if (src.startsWith("false", i) && PN_LOCAL_STOP.indexOf(src[i + 5] || " ") >= 0) { i += 5; return mkLit("false", XSD + "boolean", null); }
    var p = pname();
    if (p === null) fail("unrecognised term");
    return K(p);
  }
  function verb() {
    ws();
    if (src[i] === "a" && PN_LOCAL_STOP.indexOf(src[i + 1] || " ") >= 0) { i++; return K(RDF + "type"); }
    if (src[i] === "<") return K(iriRef());
    var p = pname();
    if (p === null) fail("expected a predicate");
    return K(p);
  }
  function predObjList(s) {
    for (;;) {
      var p = verb();
      for (;;) {
        triples.push([s, p, term()]);
        ws();
        if (src[i] === ",") { i++; continue; }
        break;
      }
      ws();
      if (src[i] === ";") {
        i++; ws();
        if (src[i] === "." || src[i] === "]" || i >= n) return;   // trailing ';'
        continue;
      }
      return;
    }
  }

  for (;;) {
    ws();
    if (i >= n) break;
    if (src[i] === "@" || /^(prefix|base)\b/i.test(src.slice(i, i + 7))) {
      var sparqlStyle = src[i] !== "@";
      if (!sparqlStyle) i++;
      if (eatCI("prefix")) {
        ws();
        var start = i;
        while (i < n && src[i] !== ":") i++;
        var pfx = src.slice(start, i);
        i++; ws();
        prefixes[pfx] = iriRef();
        ws();
        if (!sparqlStyle) { if (!eat(".")) fail("expected . after @prefix"); }
        else eat(".");
        continue;
      }
      if (eatCI("base")) {
        ws(); base = iriRef(); ws();
        if (!sparqlStyle) { if (!eat(".")) fail("expected . after @base"); } else eat(".");
        continue;
      }
      fail("unknown directive");
    }
    var subj = term();
    ws();
    if (src[i] === ".") { i++; continue; }          // bare [] block
    predObjList(subj);
    ws();
    if (!eat(".")) fail("expected . at end of statement");
  }
  return { triples: triples, prefixes: prefixes };
}

/* ======================================================================
   2. JSON-LD (rdflib's expanded output) -> the same {triples, prefixes}
   ====================================================================== */
function parseJsonLd(src) {
  var doc = JSON.parse(src);
  var nodes = Array.isArray(doc) ? doc : doc["@graph"] ? doc["@graph"] : [doc];
  var triples = [];
  function objTerm(o) {
    if (typeof o === "string") return K(o);
    if (o["@id"]) return o["@id"].indexOf("_:") === 0 ? o["@id"] : K(o["@id"]);
    if ("@value" in o) {
      var v = o["@value"];
      var dt = o["@type"] || (typeof v === "number" ? (Number.isInteger(v) ? XSD + "integer" : XSD + "decimal")
                            : typeof v === "boolean" ? XSD + "boolean" : null);
      return mkLit(String(v), dt, o["@language"] || null);
    }
    return null;
  }
  nodes.forEach(function (node) {
    var id = node["@id"];
    if (!id) return;
    var s = id.indexOf("_:") === 0 ? id : K(id);
    Object.keys(node).forEach(function (p) {
      if (p === "@id") return;
      var vals = Array.isArray(node[p]) ? node[p] : [node[p]];
      var pk = p === "@type" ? K(RDF + "type") : K(p);
      vals.forEach(function (v) {
        var o = p === "@type" ? K(typeof v === "string" ? v : v["@id"]) : objTerm(v);
        if (o) triples.push([s, pk, o]);
      });
    });
  });
  return { triples: triples, prefixes: Object.create(null) };
}

/* ======================================================================
   3. Store — three indexes over interned terms, plus IRI shortening
   ====================================================================== */
function makeStore() {
  var spo = new Map(), pos = new Map(), all = [], seen = new Set();
  var prefixes = Object.create(null), ordered = [];

  function idx(m, a, b, c) {
    var x = m.get(a); if (!x) { x = new Map(); m.set(a, x); }
    var y = x.get(b); if (!y) { y = []; x.set(b, y); }
    y.push(c);
  }
  function rebuildPrefixes() {
    ordered = Object.keys(prefixes).map(function (p) { return [prefixes[p], p]; })
      .sort(function (a, b) { return b[0].length - a[0].length; });
  }
  return {
    prefixes: prefixes,
    size: function () { return all.length; },
    add: function (parsed) {
      // First binding for a prefix wins, so merging a second file cannot silently
      // rebind a prefix the first one already used for display.
      Object.keys(parsed.prefixes).forEach(function (p) {
        if (p && prefixes[p] === undefined) prefixes[p] = parsed.prefixes[p];
      });
      rebuildPrefixes();
      parsed.triples.forEach(function (t) {
        var sig = t[0] + "\u0002" + t[1] + "\u0002" + t[2];
        if (seen.has(sig)) return;            // graphs merge cleanly (stable IRIs, no dupes)
        seen.add(sig);
        all.push(t);
        idx(spo, t[0], t[1], t[2]);
        idx(pos, t[1], t[2], t[0]);
      });
    },
    /** Objects of (subjectKey, predicateIRI). */
    objs: function (s, p) { var x = spo.get(s); if (!x) return []; return x.get(K(p)) || []; },
    one: function (s, p) { var v = this.objs(s, p); return v.length ? v[0] : null; },
    /** Subjects of (predicateIRI, objectKey). */
    subj: function (p, oKey) { var x = pos.get(K(p)); if (!x) return []; return x.get(oKey) || []; },
    typed: function (cls) { return this.subj(RDF + "type", K(cls)); },
    has: function (s, p, oKey) { return this.objs(s, p).indexOf(oKey) >= 0; },
    triples: function () { return all; },
    /** IRI -> qname using the loaded @prefix bindings (longest namespace wins). */
    short: function (iri) {
      for (var x = 0; x < ordered.length; x++) {
        if (iri.indexOf(ordered[x][0]) === 0) return ordered[x][1] + ":" + iri.slice(ordered[x][0].length);
      }
      return iri;
    }
  };
}

function localName(iri) {
  var s = String(iri), h = s.lastIndexOf("#"), sl = s.lastIndexOf("/");
  var cut = Math.max(h, sl);
  return cut >= 0 ? s.slice(cut + 1) : s;
}

/* ======================================================================
   4. Model — read the run out of the graph
   ====================================================================== */
var OUTCOME = {};
OUTCOME[COV + "Passed"] = "passed";
OUTCOME[COV + "Failed"] = "failed";
OUTCOME[COV + "Skipped"] = "skipped";
var ROLE = {};
ROLE[COV + "Covered"] = "covered";
ROLE[COV + "QueryOnly"] = "query-only";
ROLE[COV + "Structural"] = "schema";
ROLE[COV + "Unused"] = "unused";

function outcomeOf(st, s, p) {
  var o = st.one(s, p);
  return o && isIri(o) ? (OUTCOME[iriOf(o)] || "failed") : null;
}

/** cov:SourceFile nodes attached to a spec: the verbatim Turtle it is defined by
    and the SPARQL it ran, so the report needs no access to the original files. */
function readSources(st, s) {
  return st.objs(s, COV + "embeddedSource").map(function (n) {
    return {
      path: text(st.one(n, COV + "filePath")),
      media: text(st.one(n, COV + "mediaType")) || "text/turtle",
      body: text(st.one(n, COV + "fileText")) || ""
    };
  }).sort(function (a, b) {                     // the spec first, then its queries
    return (a.path ? 0 : 1) - (b.path ? 0 : 1) || (a.path || "").localeCompare(b.path || "");
  });
}

/** {iri: {name, source, sources, …}} for every must:TestSpec in the graph. */
function readSpecs(st) {
  var out = {};
  st.typed(MUST + "TestSpec").forEach(function (s) {
    if (!isIri(s)) return;
    out[iriOf(s)] = {
      iri: iriOf(s),
      name: text(st.one(s, MUST + "specFileName")) || localName(iriOf(s)),
      source: text(st.one(s, MUST + "specSourceFile")),
      sources: readSources(st, s),
      inData: st.objs(s, COV + "usesInData").filter(isIri).map(iriOf).sort(),
      inQuery: st.objs(s, COV + "usesInQuery").filter(isIri).map(iriOf).sort()
    };
  });
  return out;
}

/** {path: source} across every spec — lets any file reference in the report open
    the text that was actually read, instead of a link into a filesystem the
    reader does not have. */
function sourcesByPath(specs) {
  var by = {};
  Object.keys(specs).forEach(function (k) {
    (specs[k].sources || []).forEach(function (src) {
      if (src.path && !by[src.path]) by[src.path] = src;
    });
  });
  return by;
}

/** cov:TestResult records, grouped module -> class, Playwright-style. */
function readTests(st, specs) {
  var rows = st.typed(COV + "TestResult").map(function (r) {
    var spec = st.one(r, COV + "resultTest");
    var specIri = spec && isIri(spec) ? iriOf(spec) : null;
    return {
      status: outcomeOf(st, r, COV + "resultOutcome") || "failed",
      type: text(st.one(r, COV + "testType")) || "",
      module: text(st.one(r, COV + "module")) || "",
      cls: text(st.one(r, COV + "className")) || "",
      name: text(st.one(r, COV + "testName")) || localName(iriOf(r)),
      duration: num(st.one(r, COV + "duration")),
      spec: specIri ? specs[specIri] || { iri: specIri, name: localName(specIri) } : null,
      source: text(st.one(r, COV + "sourceFile"))
    };
  });
  rows.sort(function (a, b) { return a.name.localeCompare(b.name); });

  var groups = [], byKey = new Map();
  rows.forEach(function (t) {
    var label = [t.module, t.cls].filter(Boolean).join(" › ") || "tests";
    var g = byKey.get(label);
    if (!g) { g = { label: label, tests: [], passed: 0, failed: 0, skipped: 0, duration: 0 }; byKey.set(label, g); groups.push(g); }
    g.tests.push(t);
    g[t.status] = (g[t.status] || 0) + 1;
    g.duration += t.duration || 0;
  });
  groups.sort(function (a, b) { return a.label.localeCompare(b.label); });
  var totals = { passed: 0, failed: 0, skipped: 0, duration: 0, total: rows.length };
  rows.forEach(function (t) { totals[t.status] = (totals[t.status] || 0) + 1; totals.duration += t.duration || 0; });
  return { groups: groups, totals: totals, rows: rows };
}

/** dqv:QualityMeasurement values, keyed by metric IRI. */
function readMeasurements(st) {
  var out = {};
  st.typed(DQV + "QualityMeasurement").forEach(function (m) {
    var metric = st.one(m, DQV + "isMeasurementOf");
    if (metric && isIri(metric)) out[iriOf(metric)] = num(st.one(m, DQV + "value"));
  });
  return out;
}

function readOntologies(st) {
  return st.typed(OWL + "Ontology").filter(isIri).map(function (o) {
    return {
      iri: iriOf(o),
      path: text(st.one(o, COV + "sourceFile")),
      version: text(st.one(o, OWL + "versionIRI")),
      comment: text(st.one(o, RDFS + "comment")) || text(st.one(o, RDFS + "label"))
    };
  }).sort(function (a, b) { return a.iri.localeCompare(b.iri); });
}

/** cov:TermCoverage records -> {iri: {kind, role, cqRole, inData, inQuery, reasons, exercises}}. */
function readTerms(st, specs) {
  var terms = {};
  st.typed(COV + "TermCoverage").forEach(function (tc) {
    var t = st.one(tc, COV + "term");
    if (!t || !isIri(t)) return;
    var role = st.one(tc, COV + "role"), cq = st.one(tc, COV + "cqRole");
    var exercises = st.objs(tc, COV + "exercise").map(function (e) {
      var tst = st.one(e, COV + "test");
      var iri = tst && isIri(tst) ? iriOf(tst) : null;
      var meta = iri ? specs[iri] : null;
      return {
        iri: iri, name: (meta && meta.name) || (iri && localName(iri)) || "?",
        source: meta && meta.source,
        inData: truthy(st.one(e, COV + "inData")), inQuery: truthy(st.one(e, COV + "inQuery"))
      };
    }).sort(function (a, b) { return a.name.localeCompare(b.name); });
    terms[iriOf(t)] = {
      iri: iriOf(t),
      kind: text(st.one(tc, COV + "kind")) || "class",
      role: (role && isIri(role) && ROLE[iriOf(role)]) || "unused",
      cqRole: cq && isIri(cq) ? ROLE[iriOf(cq)] || "unused" : null,
      inData: truthy(st.one(tc, COV + "inData")),
      inQuery: truthy(st.one(tc, COV + "inQuery")),
      reasons: st.objs(tc, COV + "structuralReason").map(text).sort(),
      exercises: exercises
    };
  });
  return terms;
}

/** Order terms as an rdfs:subClassOf forest with rdfs:domain properties nested
    beneath their class — the shape the Markdown report uses. Falls back to a
    flat, namespace-sorted list when the ontology TBox is not in the graph. */
function orderTerms(st, terms) {
  var iris = Object.keys(terms);
  var declared = new Set(iris);
  var classes = iris.filter(function (t) { return terms[t].kind === "class"; });
  var props = iris.filter(function (t) { return terms[t].kind !== "class"; });
  var byShort = function (a, b) { return st.short(a).localeCompare(st.short(b)); };

  var parent = {}, children = {};
  classes.forEach(function (c) {
    var sup = st.objs(K(c), RDFS + "subClassOf").filter(isIri).map(iriOf)
      .filter(function (p) { return declared.has(p) && p !== c; }).sort(byShort);
    if (sup.length) { parent[c] = sup[0]; (children[sup[0]] = children[sup[0]] || []).push(c); }
  });
  var attached = {}, loose = [];
  props.sort(byShort).forEach(function (p) {
    var dom = st.objs(K(p), RDFS + "domain").filter(isIri).map(iriOf)
      .filter(function (d) { return declared.has(d); }).sort(byShort);
    if (dom.length) (attached[dom[0]] = attached[dom[0]] || []).push(p);
    else loose.push(p);
  });

  var rows = [], seen = new Set();
  function walk(iri, depth, glyph) {
    if (seen.has(iri)) return;
    seen.add(iri);
    rows.push({ iri: iri, depth: depth, glyph: glyph, t: terms[iri] });
    (attached[iri] || []).forEach(function (p) { walk(p, depth + 1, "▸"); });
    (children[iri] || []).sort(byShort).forEach(function (c) { walk(c, depth + 1, "↳"); });
  }
  classes.filter(function (c) { return !parent[c]; }).sort(byShort).forEach(function (c) { walk(c, 0, ""); });
  classes.sort(byShort).forEach(function (c) { walk(c, 0, ""); });      // cycle safety net
  loose.forEach(function (p) { walk(p, 0, ""); });
  return rows;
}

function readCoverage(st, specs) {
  var terms = readTerms(st, specs);
  var iris = Object.keys(terms);
  if (!iris.length) return null;
  var m = readMeasurements(st);
  var schema = iris.filter(function (t) { return terms[t].role === "schema"; });
  var denom = iris.length - schema.length;
  var covered = iris.filter(function (t) { return terms[t].role === "covered"; }).length;
  var hasCq = m[COV + "termCoverageByCompetencyQuestions"] !== undefined;
  var coveredCq = iris.filter(function (t) { return terms[t].cqRole === "covered"; }).length;
  return {
    terms: terms, rows: orderTerms(st, terms), ontologies: readOntologies(st),
    declared: iris.length, schema: schema.length, denom: denom, covered: covered,
    pct: denom ? Math.round(100 * covered / denom) : 0,
    hasCq: hasCq, coveredCq: coveredCq,
    cqPct: denom ? Math.round(100 * coveredCq / denom) : 0,
    ratio: m[COV + "termCoverageByTests"], cqRatio: m[COV + "termCoverageByCompetencyQuestions"]
  };
}

function readCqs(st, specs) {
  var byCq = {};
  st.typed(COV + "Assertion").forEach(function (a) {
    var cq = st.one(a, COV + "onCompetencyQuestion"), t = st.one(a, COV + "onTest");
    if (!cq || !isIri(cq)) return;
    (byCq[iriOf(cq)] = byCq[iriOf(cq)] || []).push({
      spec: t && isIri(t) ? specs[iriOf(t)] || { iri: iriOf(t), name: localName(iriOf(t)) } : null,
      status: outcomeOf(st, a, COV + "outcome"),
      requiresOntology: truthy(st.one(a, COV + "requiresOntology"))
    });
  });
  var out = st.typed(CQNS + "CompetencyQuestion").filter(isIri).map(function (c) {
    var iri = iriOf(c);
    var linked = st.objs(c, CQNS + "cqSpec").filter(isIri).map(iriOf);
    var tests = (byCq[iri] || []).sort(function (a, b) {
      return ((a.spec && a.spec.name) || "").localeCompare((b.spec && b.spec.name) || "");
    });
    var resolved = new Set(tests.map(function (t) { return t.spec && t.spec.iri; }));
    return {
      iri: iri, name: localName(iri),
      questions: st.objs(c, CQNS + "question").map(text).sort(),
      source: text(st.one(c, COV + "sourceFile")),
      duplicate: truthy(st.one(c, COV + "duplicate")),
      tests: tests,
      missing: linked.filter(function (l) { return !resolved.has(l) && !specs[l]; })
    };
  });
  out.sort(function (a, b) { return ((a.questions[0] || a.name)).localeCompare(b.questions[0] || b.name); });
  return out;
}

function readIssues(st, specs) {
  function refs(issue) {
    return st.objs(issue, COV + "reference").map(function (r) {
      var t = st.one(r, COV + "test");
      var iri = t && isIri(t) ? iriOf(t) : null;
      var meta = iri ? specs[iri] : null;
      return {
        name: (meta && meta.name) || (iri && localName(iri)) || "?", source: meta && meta.source,
        inData: truthy(st.one(r, COV + "inData")), inQuery: truthy(st.one(r, COV + "inQuery"))
      };
    }).sort(function (a, b) { return a.name.localeCompare(b.name); });
  }
  var undeclared = st.subj(COV + "issueType", K(COV + "UsedButNotDeclared")).map(function (issue) {
    var t = st.one(issue, COV + "aboutTerm");
    return { term: t && isIri(t) ? iriOf(t) : "?", refs: refs(issue) };
  }).sort(function (a, b) { return a.term.localeCompare(b.term); });
  var tbox = st.subj(COV + "issueType", K(COV + "TBoxInTestData")).map(function (issue) {
    var t = st.one(issue, COV + "aboutTest");
    var meta = t && isIri(t) ? specs[iriOf(t)] : null;
    return {
      name: (meta && meta.name) || (t && isIri(t) ? localName(iriOf(t)) : "?"),
      source: meta && meta.source,
      axioms: st.objs(issue, COV + "detail").map(text).sort()
    };
  }).sort(function (a, b) { return a.name.localeCompare(b.name); });
  return { undeclared: undeclared, tbox: tbox };
}

function readRun(st) {
  var runs = st.typed(COV + "CoverageRun");
  if (!runs.length) return {};
  var r = runs[0];
  var agent = st.one(r, PROV + "wasAssociatedWith");
  return {
    iri: isIri(r) ? iriOf(r) : null,
    slug: isIri(r) ? localName(iriOf(r)) : null,
    commit: st.objs(r, PROV + "used").filter(isIri).map(iriOf)
      .filter(function (u) { return /\/commit\//.test(u); })[0] || null,
    version: agent ? text(st.one(agent, OWL + "versionInfo")) : null
  };
}

/* ======================================================================
   5. UI — VanJS

   Builds DOM, never HTML strings: text goes in as Text nodes, so there is no
   escaping to get wrong, and state drives the updates. The whole UI is a
   function of six states — the loaded model, the current tab, the filter text,
   the outcome and role toggles, and the open source sheet — bound at the
   smallest useful granularity, so typing in a filter re-renders the list but
   not the toolbar it is typed into.
   ====================================================================== */
const {
  a, abbr, button, code, dd, details, div, dl, dt, em, footer, h1, h2, header,
  input, label, li, main: mainTag, nav, p, pre, section, small, span, strong,
  summary, table, tbody, td, th, thead, tr, ul
} = van.tags;
const { state } = van;

let CFG = {};

/* ---- state ---- */
const model = state(null);                  // the run, read out of the graph
const tab = state("tests");
const query = state("");
const show = { passed: state(true), failed: state(true), skipped: state(true) };
const ROLES = ["covered", "query-only", "schema", "unused"];
const roleOn = Object.fromEntries(ROLES.map(r => [r, state(false)]));
const sheet = state(null);                  // source file shown over the page
const dragging = state(false);
const failure = state("");                  // a load/parse error to surface

/* ---- presentational helpers ---- */
const pill = (kind, txt) => span({ class: "pill " + kind }, txt || kind);
const tick = on => span({ class: on ? "yes" : "no" }, on ? "✓" : "–");
const dur = s => s == null ? "" : s < 1 ? Math.round(s * 1000) + "ms" : s.toFixed(2) + "s";
const secHead = (title, n) =>
  div({ class: "sec-head" }, h2(title), span({ class: "rule" }),
      n === undefined ? [] : span({ class: "n" }, n));
const empty = msg => div({ class: "card" }, p({ class: "empty" }, msg));
const short = iri => model.val ? model.val.store.short(iri) : iri;
const hits = text =>
  !query.val || String(text).toLowerCase().includes(query.val.toLowerCase());

/* ---- source references ----------------------------------------------------
   A path in the graph only resolves from the directory the run happened in, so
   prefer the copy embedded in this page (opens in place), then a configured base
   URL (a repo link, when published from CI), and otherwise plain text rather
   than a link that would 404. */
const srcBase = () => CFG.srcBase || "";

const srcRef = (path, name = path) => {
  if (!path) return name || "";
  const src = model.val?.sources[path];
  if (src) {
    return a({ class: "srclink", href: "#", title: "Show " + path,
               onclick: ev => { ev.preventDefault(); sheet.val = src; } }, name);
  }
  const base = srcBase();
  return base ? a({ href: base + path, title: path }, name)
              : span({ title: path }, name);
};

/* ---- syntax highlighting for the embedded Turtle / SPARQL -----------------
   Returns Text nodes and <span>s, so highlighting cannot alter the content it
   presents. */
const TTL_RE = new RegExp([
  "(#[^\\n]*)",                                                   // comment
  "(\"\"\"[\\s\\S]*?\"\"\"|'''[\\s\\S]*?'''|\"(?:\\\\.|[^\"\\\\\\n])*\"|'(?:\\\\.|[^'\\\\\\n])*')",
  "(<[^>\\s]*>)",                                                 // IRI
  "(@prefix|@base|\\ba\\b|\\btrue\\b|\\bfalse\\b)",               // keyword
  "([A-Za-z][\\w.-]*:[\\w.\\-%]*)",                               // prefixed name
  "(-?\\b\\d+(?:\\.\\d+)?\\b)"                                    // number
].join("|"), "g");
const TTL_CLASSES = [null, "comment", "string", "iri", "kw", "pname", "num"];

const SPARQL_RE = new RegExp([
  "(#[^\\n]*)",
  "(\"\"\"[\\s\\S]*?\"\"\"|\"(?:\\\\.|[^\"\\\\\\n])*\"|'(?:\\\\.|[^'\\\\\\n])*')",
  "(<[^>\\s]*>)",
  "([?$][A-Za-z_]\\w*)",                                          // variable
  "\\b(SELECT|CONSTRUCT|ASK|DESCRIBE|WHERE|INSERT|DELETE|DATA|GRAPH|OPTIONAL|" +
    "FILTER|BIND|VALUES|UNION|MINUS|SERVICE|PREFIX|BASE|DISTINCT|REDUCED|ORDER|" +
    "GROUP|BY|HAVING|LIMIT|OFFSET|AS|NOT|EXISTS|IN|WITH|USING|FROM|NAMED|SILENT|" +
    "CLEAR|DROP|CREATE|LOAD|INTO|COPY|MOVE|ADD|TRUE|FALSE)\\b",
  "([A-Za-z][\\w.-]*:[\\w.\\-%]*)"
].join("|"), "gi");
const SPARQL_CLASSES = [null, "comment", "string", "iri", "var", "kw", "pname"];

const highlight = (body, media) => {
  const sparql = /sparql/i.test(media || "");
  const re = sparql ? SPARQL_RE : TTL_RE;
  const classes = sparql ? SPARQL_CLASSES : TTL_CLASSES;
  const out = [];
  let last = 0, m;
  re.lastIndex = 0;
  while ((m = re.exec(body)) !== null) {
    if (!m[0].length) { re.lastIndex++; continue; }        // never loop forever
    const cls = classes.find((c, g) => g && m[g] !== undefined);
    if (m.index > last) out.push(body.slice(last, m.index));
    out.push(cls ? span({ class: "tok-" + cls }, m[0]) : m[0]);
    last = m.index + m[0].length;
  }
  if (last < body.length) out.push(body.slice(last));
  return out;
};

const sourceLabel = src =>
  src.path || (/sparql/i.test(src.media) ? "SPARQL (as executed)" : "source");
const codeBlock = src => pre({ class: "code" }, highlight(src.body, src.media));
const sourceDetails = sources => (sources || []).map(src =>
  details({ class: "src" },
    summary(sourceLabel(src), " · ", src.media),
    codeBlock(src)));

/* ---- toolbar pieces ---- */
const searchBox = placeholder => input({
  class: "search", type: "search", placeholder, value: query.val,
  oninput: ev => query.val = ev.target.value
});
const toggleChip = (st, cls, name, count) => button({
  class: "chip " + (cls || ""),
  "aria-pressed": () => String(st.val),
  onclick: () => st.val = !st.val
}, name, count === undefined ? [] : span({ class: "n" }, count));

/** Expand/collapse every disclosure in the results area. Plain DOM: which
    <details> are open is view state the model has no opinion about. */
const setAllOpen = open => document.getElementById("main")
  ?.querySelectorAll("details").forEach(d => d.open = open);

/* ======================================================================
   6. Tabs
   ====================================================================== */
const CHIP_CLASS = { passed: "pass", failed: "fail", skipped: "skip" };

const TestsTab = M => div(
  div({ class: "toolbar" },
    searchBox("Filter tests…"),
    div({ class: "chips" }, Object.keys(show).map(s =>
      toggleChip(show[s], CHIP_CLASS[s], s, M.tests.totals[s] || 0))),
    button({ onclick: () => setAllOpen(true) }, "Expand all"),
    button({ onclick: () => setAllOpen(false) }, "Collapse all")),
  () => TestGroups(M));

const testShown = t => show[t.status]?.val &&
  hits(`${t.name} ${t.module} ${t.cls} ${t.spec ? t.spec.iri : ""}`);

const TestGroups = M => {
  const groups = M.tests.groups.map(g => {
    const visible = g.tests.filter(testShown);
    if (!visible.length) return null;
    return details({ class: "grp", open: visible.some(t => t.status === "failed") || !!query.val },
      summary(
        span({ class: "gname" }, g.label),
        span({ class: "gmeta" },
          g.failed ? pill("failed", g.failed + " failed") : [],
          g.skipped ? pill("skipped", g.skipped + " skipped") : [],
          span(`${visible.length} test${visible.length === 1 ? "" : "s"}`),
          span({ class: "dur" }, dur(g.duration)))),
      ul({ class: "tests" }, visible.map(TestRow)));
  }).filter(Boolean);
  return groups.length ? div({ class: "card" }, groups)
                       : empty("No tests match the current filter.");
};

const termChips = iris => div({ class: "terms" },
  iris.map(t => span({ class: "term-chip", title: t }, short(t))));

const TestRow = t => {
  const kv = [];
  const row = (k, v) => kv.push(dt(k), dd(v));
  if (t.spec) {
    if (t.spec.source) row("spec file", srcRef(t.spec.source));
    row("spec IRI", code(t.spec.iri));
    if (t.spec.inData?.length) row("in data", termChips(t.spec.inData));
    if (t.spec.inQuery?.length) row("in SPARQL", termChips(t.spec.inQuery));
    const answers = model.val.cqs.filter(c =>
      c.tests.some(x => x.spec && x.spec.iri === t.spec.iri));
    if (answers.length) row("answers", answers.map(c => div(c.questions[0] || c.name)));
  } else if (t.source) {
    row("file", srcRef(t.source));
  }
  if (t.type) row("type", t.type);

  const sources = sourceDetails(t.spec?.sources);
  return li(details(
    summary({ class: "t" },
      pill(t.status),
      span({ class: "name" }, t.name),
      span({ class: "right" }, span({ class: "dur" }, dur(t.duration)))),
    kv.length || sources.length
      ? div({ class: "detail" }, kv.length ? dl({ class: "kv" }, kv) : [], sources)
      : []));
};

const CoverageTab = M => {
  const C = M.coverage;
  if (!C) {
    return empty(["This run has no ontology term coverage. Re-run with ",
                  code("--term-coverage"), ", and declare ",
                  code("mustrdTest:hasOntologyPath"), " in the config."]);
  }
  const count = role => Object.values(C.terms).filter(t => t.role === role).length;
  return div(
    div({ class: "toolbar" },
      searchBox("Filter terms…"),
      div({ class: "chips" }, ROLES.map(r => toggleChip(roleOn[r], "", r, count(r))))),
    p({ class: "note" },
      "A term counts as ", strong("covered"), " when a passing test ",
      strong("populates it in input data"), ". A term named only in a query is ",
      strong("query-only"), " and does not count. ", strong("structural"),
      " terms are load-bearing but excluded from the denominator. Classes nest by ",
      code("rdfs:subClassOf"), " (↳), properties under their ", code("rdfs:domain"),
      " (▸). Click a row for the per-test breakdown."),
    div({ class: "card tblwrap" }, table(
      thead(tr(
        th("Term"), th("Kind"),
        th({ class: "c" }, abbr({ title: "A passing test asserts the term in its given data" }, "In data")),
        th({ class: "c" }, abbr({ title: "A passing test's SPARQL names the term" }, "In SPARQL")),
        th({ class: "c" }, "Test coverage"),
        th({ class: "c" }, "CQ coverage"))),
      () => TermRows(C))),
    C.ontologies.length
      ? [secHead("Ontologies measured", C.ontologies.length),
         div({ class: "card" }, C.ontologies.map(OntologyCard))]
      : []);
};

const OntologyCard = o => div({ class: "cq" },
  p({ class: "q mono" }, o.iri),
  o.comment ? p({ class: "note" }, o.comment) : [],
  o.path ? p({ class: "note" }, srcRef(o.path)) : [],
  o.version ? p({ class: "note mono" }, "version: " + o.version) : []);

const TermRows = C => {
  const anyRole = ROLES.some(r => roleOn[r].val);
  const rows = [];
  C.rows
    .filter(r => (!anyRole || roleOn[r.t.role].val) && hits(`${short(r.iri)} ${r.iri}`))
    .forEach(({ iri, depth, glyph, t }) => {
      const pad = depth * 1.15;
      // Per-row disclosure: a bound `hidden`, so expanding one term does not
      // rebuild the table.
      const open = state(false);
      const hidden = () => !open.val;
      const indent = extra => `padding-left:${pad + extra}rem`;

      rows.push(tr({ class: "term", title: iri,
                     onclick: ev => { if (!ev.target.closest("a")) open.val = !open.val; } },
        td({ class: "tname", style: indent(0.7) },
           glyph ? [span({ class: "glyph" }, glyph), " "] : [], short(iri)),
        td(t.kind),
        td({ class: "c" }, tick(t.inData)),
        td({ class: "c" }, tick(t.inQuery)),
        td({ class: "c" }, pill(t.role)),
        td({ class: "c" }, t.cqRole ? pill(t.cqRole) : [])));

      if (t.reasons.length) {
        rows.push(tr({ class: "ex", hidden },
          td({ colspan: 6, class: "note", style: indent(2.2) },
             "structural because: " + t.reasons.join("; "))));
      }
      t.exercises.forEach(e => rows.push(tr({ class: "ex", hidden },
        td({ style: indent(2.2) },
           span({ class: "glyph" }, "•"), " ", srcRef(e.source, e.name)),
        td(), td({ class: "c" }, tick(e.inData)), td({ class: "c" }, tick(e.inQuery)),
        td(), td())));
    });
  return tbody(rows.length ? rows : tr(td({ colspan: 6, class: "empty" }, "No terms match.")));
};

const CqsTab = M => {
  if (!M.cqs.length) {
    return empty(["No competency questions in this graph. Re-run with ", code("--cq"), "."]);
  }
  return div(
    div({ class: "toolbar" }, searchBox("Filter questions…")),
    () => {
      const cards = M.cqs
        .filter(c => hits(c.questions.join(" ") + " " + c.name))
        .map(CqCard);
      return cards.length ? div({ class: "card" }, cards) : empty("No questions match.");
    });
};

const cqBadges = c => [
  c.duplicate ? pill("query-only", "duplicate question") : [],
  !c.tests.length ? pill("unused", "no linked test")
    : c.tests.some(t => t.status === "failed") ? pill("failed", "failing")
    : pill("passed", "verified")
];

const CqCard = c => div({ class: "cq" },
  p({ class: "q" }, c.questions[0] || c.name),
  div({ class: "badges" }, cqBadges(c)),
  c.questions.length > 1
    ? p({ class: "note" }, "also asked as: " + c.questions.slice(1).join(" · ")) : [],
  c.tests.length || c.missing.length
    ? ul(
        c.tests.map(t => li(
          pill(t.status || "plain", t.status || "unknown"), " ",
          t.spec ? srcRef(t.spec.source, t.spec.name) : "?",
          t.requiresOntology ? [" ", pill("schema", "needs ontology")] : [])),
        c.missing.map(iri => li({ class: "warnrow" },
          "cq:cqSpec points at ", code(iri),
          ", which no test in this run provides")))
    : [],
  c.source ? p({ class: "note" }, "defined in ", srcRef(c.source)) : []);

const where = r =>
  " — " + [r.inData && "in data", r.inQuery && "in SPARQL"].filter(Boolean).join(" and ");

const IssuesTab = M => {
  const { undeclared, tbox } = M.issues;
  if (!undeclared.length && !tbox.length) return empty("No quality issues found in this run. ✨");
  return div(
    undeclared.length ? [
      secHead("Used but not declared", undeclared.length),
      p({ class: "note" },
        "Terms a test references inside a measured ontology’s namespace that the " +
        "ontology never declares — usually a typo or a missing definition."),
      div({ class: "card" }, undeclared.map(u => div({ class: "cq" },
        p({ class: "q mono" }, short(u.term)),
        p({ class: "note mono" }, u.term),
        ul(u.refs.map(r => li(srcRef(r.source, r.name),
                              span({ class: "note" }, where(r))))))))
    ] : [],
    tbox.length ? [
      secHead("TBox in test data", tbox.length),
      p({ class: "note" },
        "Schema axioms found in a test’s input data, where only instance data belongs."),
      div({ class: "card" }, tbox.map(t => div({ class: "cq" },
        p({ class: "q" }, srcRef(t.source, t.name)),
        ul(t.axioms.map(ax => li({ class: "mono" }, ax))))))
    ] : []);
};

const SourceTab = M => {
  const prefixes = Object.keys(M.store.prefixes).sort();
  return div(
    div({ class: "toolbar" },
      M.raw ? a({ class: "btn", download: "mustrd-run.ttl",
                  href: "data:text/turtle;charset=utf-8," + encodeURIComponent(M.raw) },
                "Download TTL") : [],
      span({ class: "note" }, `${M.store.size()} triples, ${prefixes.length} prefixes`)),
    prefixes.length
      ? div({ class: "card tblwrap" }, table(
          thead(tr(th("Prefix"), th("Namespace"))),
          tbody(prefixes.map(pfx => tr(td({ class: "mono" }, pfx + ":"),
                                       td({ class: "mono" }, M.store.prefixes[pfx]))))))
      : [],
    M.raw
      ? [secHead("Turtle"),
         div({ class: "card" }, pre({
           class: "code", style: "max-height:70vh;border:none;border-radius:0"
         }, highlight(M.raw, "text/turtle")))]
      : []);
};

const TABS = [
  { id: "tests", label: "Tests", count: M => M.tests.totals.total, view: TestsTab },
  { id: "coverage", label: "Coverage", count: M => M.coverage ? M.coverage.declared : 0, view: CoverageTab },
  { id: "cqs", label: "Competency questions", count: M => M.cqs.length, view: CqsTab },
  { id: "issues", label: "Issues", count: M => M.issues.undeclared.length + M.issues.tbox.length, view: IssuesTab },
  { id: "source", label: "Source", count: () => null, view: SourceTab }
];

const liveTabs = M => {
  const live = TABS.filter(t => { const c = t.count(M); return c === null || c > 0; });
  return live.length ? live : [TABS.at(-1)];
};

/* ======================================================================
   7. Summary tiles, shell
   ====================================================================== */
const bar = parts => div({ class: "bar" },
  parts.filter(([, pct]) => pct > 0)
       .map(([cls, pct]) => span({ class: cls, style: `width:${pct}%` })));

const tile = (name, big, sub, parts) => div({ class: "tile" },
  div({ class: "label" }, name),
  div({ class: "big" }, big[0], " ", small(big[1])),
  div({ class: "sub" }, sub),
  parts ? bar(parts) : []);

const Tiles = M => {
  const tiles = [], t = M.tests.totals, C = M.coverage;
  if (t.total) {
    const pc = k => 100 * (t[k] || 0) / t.total;
    tiles.push(tile("Tests", [t.passed || 0, `/ ${t.total} passed`],
      `${t.failed || 0} failed · ${t.skipped || 0} skipped · ${dur(t.duration)}`,
      [["p", pc("passed")], ["f", pc("failed")], ["s", pc("skipped")]]));
  }
  if (C) {
    tiles.push(tile("Term coverage by tests", [C.pct + "%", `${C.covered}/${C.denom} terms`],
      `${C.declared} declared · ${C.schema} structural excluded`, [["c", C.pct]]));
    if (C.hasCq) {
      tiles.push(tile("Coverage by competency question",
        [C.cqPct + "%", `${C.coveredCq}/${C.denom} terms`],
        `${C.covered - C.coveredCq} covered by tests but no CQ`, [["q", C.cqPct]]));
    }
  }
  if (M.cqs.length) {
    const verified = M.cqs.filter(c =>
      c.tests.length && c.tests.every(x => x.status === "passed")).length;
    tiles.push(tile("Competency questions", [verified, `/ ${M.cqs.length} verified`],
      `${M.cqs.filter(c => !c.tests.length).length} with no linked test`,
      [["p", 100 * verified / M.cqs.length]]));
  }
  return section({ class: "tiles" }, tiles);
};

const RunMeta = M => {
  const { run } = M, bits = [];
  const item = (k, v) => bits.push(span(span({ class: "k" }, k), " ", v));
  if (run.slug && run.slug !== "local") item("run", code(run.slug.slice(0, 12)));
  if (run.commit) item("commit", a({ href: run.commit }, localName(run.commit).slice(0, 8)));
  if (run.version) item("mustrd", run.version);
  item("triples", String(M.store.size()));
  return div({ class: "runmeta" }, bits);
};

/** Cycle explicit light → explicit dark → follow the OS. */
const toggleTheme = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "light" ? "dark" : cur === "dark" ? "" : "light";
  if (next) document.documentElement.setAttribute("data-theme", next);
  else document.documentElement.removeAttribute("data-theme");
  try { localStorage.setItem("mustrd-theme", next); } catch (e) { /* private mode */ }
};

const NoData = () => div({ class: "card" }, p({ class: "empty" },
  "No run data loaded.", div(), div(),
  "Drop a ", code(".ttl"), " / ", code(".jsonld"), " from ",
  code("mustrd report --term-coverage-rdf"), " or ", code("--results-rdf"),
  " onto this page, use ", em("Load TTL"), ", or append ",
  code("?ttl=path/to/run.ttl"), " to the URL."));

const Shell = () => [
  div({ class: "wrap" },
    header({ class: "top" },
      div(
        p({ class: "eyebrow" }, "mustrd · spec-by-example for RDF & SPARQL"),
        div({ class: "brand" }, span({ class: "dot" }),
            h1({ id: "pageTitle" }, document.title || "Run report")),
        () => model.val ? RunMeta(model.val) : div({ class: "runmeta" })),
      div({ class: "actions" },
        label({ class: "btn" }, "Load TTL", input({
          type: "file", hidden: true, multiple: true,
          accept: ".ttl,.turtle,.n3,.nt,.jsonld,.json",
          onchange: ev => loadFiles(ev.target.files)
        })),
        button({ title: "Toggle light / dark", onclick: toggleTheme }, "◐"))),

    () => model.val ? Tiles(model.val) : section({ class: "tiles" }),

    nav({ class: "tabs", role: "tablist" }, () => {
      const M = model.val;
      return div({ class: "tabrow" }, !M ? [] : liveTabs(M).map(t => button({
        role: "tab", "data-tab": t.id,
        "aria-selected": () => String(tab.val === t.id),
        onclick: () => { tab.val = t.id; query.val = ""; }
      }, t.label, t.count(M) === null ? [] : span({ class: "n" }, t.count(M)))));
    }),

    mainTag({ id: "main" }, () => {
      if (failure.val) return div({ class: "err" }, failure.val);
      const M = model.val;
      if (!M?.store.size()) return NoData();
      const live = liveTabs(M);
      return (live.find(t => t.id === tab.val) || live[0]).view(M);
    }),

    footer(() => div(
      "Rendered in the browser from ",
      strong(model.val ? String(model.val.store.size()) : "0"),
      " triples of RDF (", code("cov:"), "/", code("must:"), "/", code("cq:"), "/",
      code("dqv:"), "). Drop another ", code(".ttl"), " or ", code(".jsonld"),
      " anywhere on the page to merge it in."))),

  div({ class: "drop", hidden: () => !dragging.val },
    div({ class: "inner" }, "Drop ", code(".ttl"), " / ", code(".jsonld"), " to load")),

  div({ class: "sheet", hidden: () => !sheet.val,
        onclick: ev => { if (ev.target === ev.currentTarget) sheet.val = null; } },
    () => div({ class: "panel" },
      div({ class: "head" },
        span({ class: "path" },
              sheet.val ? `${sourceLabel(sheet.val)}  ·  ${sheet.val.media}` : ""),
        button({ onclick: () => sheet.val = null }, "Close ✕")),
      sheet.val ? codeBlock(sheet.val) : pre({ class: "code" })))
];

/* ======================================================================
   8. Loading data
   ====================================================================== */
const STORE = makeStore();
let RAW = "";

const rebuild = () => {
  const specs = readSpecs(STORE);
  model.val = {
    store: STORE, raw: RAW, specs, sources: sourcesByPath(specs),
    run: readRun(STORE),
    tests: readTests(STORE, specs),
    coverage: readCoverage(STORE, specs),
    cqs: readCqs(STORE, specs),
    issues: readIssues(STORE, specs)
  };
  // Keep the selected tab valid as data arrives — a results-only graph has no
  // Coverage tab, for instance.
  const live = liveTabs(model.val);
  if (!live.some(t => t.id === tab.val)) tab.val = live[0].id;
};

const ingest = (name, body) => {
  STORE.add(/\.(jsonld|json)$/i.test(name) ? parseJsonLd(body) : parseTurtle(body));
  RAW = RAW ? `${RAW}\n\n# ---- ${name} ----\n${body}` : body;
  failure.val = "";
  rebuild();
};

const loadFiles = files => [...files].forEach(f => {
  const reader = new FileReader();
  reader.onload = () => {
    try { ingest(f.name, String(reader.result)); }
    catch (e) { failure.val = `${f.name}: ${e.message}`; }
  };
  reader.readAsText(f);
});

/* ---- page-level events ---- */
document.addEventListener("keydown", ev => { if (ev.key === "Escape") sheet.val = null; });
let dragDepth = 0;
window.addEventListener("dragenter", ev => {
  ev.preventDefault();
  if (++dragDepth === 1) dragging.val = true;
});
window.addEventListener("dragover", ev => ev.preventDefault());
window.addEventListener("dragleave", () => {
  if (--dragDepth <= 0) { dragDepth = 0; dragging.val = false; }
});
window.addEventListener("drop", ev => {
  ev.preventDefault();
  dragDepth = 0;
  dragging.val = false;
  if (ev.dataTransfer?.files.length) loadFiles(ev.dataTransfer.files);
});

/* ---- boot: mount, then the inlined data, then ?ttl= ---- */
(() => {
  const readJson = id => {
    try { return JSON.parse(document.getElementById(id).textContent); }
    catch (e) { return null; }
  };
  CFG = readJson("mustrd-config") || {};

  try {
    const saved = localStorage.getItem("mustrd-theme");
    if (saved) document.documentElement.setAttribute("data-theme", saved);
  } catch (e) { /* private mode */ }

  const params = new URLSearchParams(location.search);
  const title = params.get("title");
  if (title) document.title = title;

  van.add(document.body, Shell());

  const inline = readJson("mustrd-data");
  if (typeof inline === "string" && inline.trim()) {
    try { ingest("run.ttl", inline); }
    catch (e) { failure.val = "Embedded data: " + e.message; }
  }

  params.getAll("ttl").concat(params.getAll("jsonld")).forEach(url =>
    fetch(url)
      .then(r => r.ok ? r.text() : Promise.reject(new Error(`${r.status} ${r.statusText}`)))
      .then(body => ingest(url, body))
      .catch(e => failure.val = `Could not load ${url}: ${e.message}`));
})();
</script>
</body>
</html>
